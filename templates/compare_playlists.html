<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confronto Playlist</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
            body {
                background: linear-gradient(to right, #006400, #000000);
                color: #fff;
                font-family: 'Segoe UI', sans-serif;
                padding: 2rem 1rem;
            }

            .container {
                max-width: 1200px;
                margin: auto;
            }

            h1 {
                font-size: 2.5rem;
                font-weight: bold;
                text-shadow: 1px 1px 3px #000;
            }

            h2 {
                font-size: 1.5rem;
                margin-top: 2.5rem;
                margin-bottom: 1rem;
                color: #ffffff;
                border-bottom: 2px solid #fff;
                padding-bottom: 0.5rem;
            }

            .chart-container {
                background-color: #314434; /* grigio scuro */
                padding: 1.5rem;
                border-radius: 15px;
                margin-bottom: 2rem;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            }

            .btn-success {
                background-color: #00a65a;
                border: none;
                padding: 0.75rem 1.5rem;
                font-size: 1.1rem;
                border-radius: 30px;
                transition: background-color 0.3s ease;
            }

            .btn-success:hover {
                background-color: #008f4c;
            }

            @media (max-width: 768px) {
                h1 {
                    font-size: 2rem;
                }
                h2 {
                    font-size: 1.3rem;
                }
            }

    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-5">Confronto Playlist</h1>

        <div class="chart-container text-start">
            <h2>Brani in comune</h2>
            <div id="tracks_comparison"></div>
        </div>

        <div class="chart-container text-start">
            <h2>Artisti in comune</h2>
            <div id="common_artists"></div>
        </div>

        <div class="chart-container text-start">
            <h2>Confronto Popolarità Media</h2>
            <div id="popularity_comparison"></div>
        </div>

        <div class="chart-container text-start">
            <h2>Distribuzione dei Generi Musicali</h2>
            <div id="genre_distribution"></div>
        </div>

        <div class="chart-container text-start">
            <h2>Distribuzione Temporale dei Brani</h2>
            <div id="temporal_distribution"></div>
        </div>

        <a href="{{ url_for('home.view_saved_playlists') }}" class="btn btn-success mt-4">Torna alle Playlist Salvate</a>
    </div>

    <script>
        var playlistData = {{ playlist_data | tojson }};

        const darkLayout = {
            plot_bgcolor: '#2c2c2c',
            paper_bgcolor: '#2c2c2c',
            font: { color: '#ffffff' }
        };

        function generateTracksComparison(data) {
            var trace1 = {
                x: data.playlists.map(p => p.name),
                y: data.trackData,
                type: 'bar',
                name: 'Playlist'
            };

            var trace2 = {
                x: ['In Comune'],
                y: [data.commonTracks.length],
                type: 'bar',
                name: 'In Comune'
            };

            Plotly.newPlot('tracks_comparison', [trace1, trace2], {
                ...darkLayout,
                title: 'Brani in comune',
                barmode: 'group'
            });
        }

        function generateCommonArtists(data) {
            var trace1 = {
                x: data.playlists.map(p => p.name),
                y: data.playlists.map(p => p.artists.length),
                type: 'bar',
                name: 'Playlist'
            };

            var trace2 = {
                x: ['In Comune'],
                y: [data.commonTracks.length],
                type: 'bar',
                name: 'In Comune'
            };

            Plotly.newPlot('common_artists', [trace1, trace2], {
                ...darkLayout,
                title: 'Artisti in comune',
                barmode: 'group'
            });
        }

        function generatePopularityComparison(data) {
            Plotly.newPlot('popularity_comparison', [{
                x: data.playlists.map(p => p.name),
                y: data.popularityData,
                type: 'bar',
                name: 'Popolarità Media',
                marker: { color: 'rgba(0,123,255,0.6)' }
            }], {
                ...darkLayout,
                title: 'Popolarità Media',
                xaxis: { title: 'Playlist' },
                yaxis: { title: 'Popolarità' }
            });
        }

        function generateGenreDistribution(data) {
            var traces = data.genreData.map((genreCounts, index) => ({
                labels: Object.keys(genreCounts),
                values: Object.values(genreCounts),
                type: 'pie',
                name: data.playlists[index].name
            }));

            Plotly.newPlot('genre_distribution', traces, {
                ...darkLayout,
                title: 'Distribuzione dei Generi Musicali',
                showlegend: true
            });
        }

        function generateTemporalDistribution(data) {
            var traces = data.yearData.map((yearCounts, index) => ({
                x: Object.keys(yearCounts),
                y: Object.values(yearCounts),
                type: 'scatter',
                mode: 'lines+markers',
                name: data.playlists[index].name
            }));

            Plotly.newPlot('temporal_distribution', traces, {
                ...darkLayout,
                title: 'Distribuzione Temporale dei Brani',
                xaxis: { title: 'Anno' },
                yaxis: { title: 'Numero di Brani' }
            });
        }

        generateTracksComparison(playlistData);
        generateCommonArtists(playlistData);
        generatePopularityComparison(playlistData);
        generateGenreDistribution(playlistData);
        generateTemporalDistribution(playlistData);
    </script>
</body>
</html>
