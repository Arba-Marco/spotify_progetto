<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #006400, #000000);
            font-family: 'Arial', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .login-container {
            background: #fff;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            color: #333;
            width: 100%;
            max-width: 400px;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-header h2 {
            font-size: 1.8rem;
            margin: 0;
            color: #006400;
        }

        .close {
            font-size: 1.5rem;
            color: #ff0000;
            background: none;
            border: none;
        }

        .close:hover {
            color: #333;
        }

        .form-group label {
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 30px;
            padding: 0.75rem 1rem;
            font-size: 1em;
            border: 1px solid #ccc;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-control:focus {
            border-color: #006400;
            box-shadow: 0 0 5px rgba(0, 100, 0, 0.5);
        }

        .btn-primary {
            background-color: #006400;
            border: none;
            border-radius: 30px;
            padding: 0.75rem;
            font-size: 1.1em;
            width: 100%;
            margin-top: 1rem;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #004d00;
            transform: translateY(-2px);
        }

        a {
            color: #006400;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            color: #004d00;
            text-decoration: underline;
        }

        .alert {
            border-radius: 10px;
            font-size: 0.9rem;
        }

        .text-center {
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="modal-header">
            <h2>Login</h2>
            <button type="button" class="close" onclick="closeModal()">×</button>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} flash-message" role="alert">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" name="username" class="form-control" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" name="password" class="form-control" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary">Accedi</button>
        </form>

        <p class="text-center">
            Non hai un account? <a href="{{ url_for('login_bp.register') }}">Registrati</a>
        </p>
    </div>

    <script>
        function closeModal() {
            window.location.href = "{{ url_for('home.homepage') }}";
        }
    </script>
</body>
</html>
