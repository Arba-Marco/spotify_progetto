<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <style>
        /* Sfondo con gradiente */
        body {
            background: linear-gradient(to right, #006400, #000000);
            font-family: 'Arial', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        /* Box contenitore stile carta */
        .login-container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            color: #333;
            max-width: 400px;
            width: 100%;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            font-size: 1.8rem;
            font-weight: bold;
            margin: 0;
        }

        .close {
            font-size: 1.5rem;
            color: #ff0000;
            cursor: pointer;
        }

        .close:hover {
            color: #333;
        }

        .form-control {
            border-radius: 25px;
            padding: 12px;
            font-size: 1em;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
        }

        .btn-primary {
            background-color: #006400;
            border: none;
            border-radius: 25px;
            padding: 12px 25px;
            font-size: 1.1em;
            width: 100%;
            transition: background-color 0.3s ease;
        }

        .btn-primary:hover {
            background-color: #004d00;
        }

        a {
            color: #006400;
            font-weight: bold;
        }

        a:hover {
            color: #004d00;
        }

        .alert {
            border-radius: 10px;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="modal-header">
            <h2>Login</h2>
            <span class="close" onclick="closeModal()">×</span>
        </div>

        <!-- Messaggi Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} mt-3 flash-message" role="alert">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Accedi</button>
        </form>
        <p class="mt-3 text-center">
            Non hai un account? <a href="{{ url_for('login_bp.register') }}">Registrati</a>
        </p>
    </div>

    <script>
        function closeModal() {
            window.location.href = "{{ url_for('home.homepage') }}";
        }
    </script>
</body>
</html>
