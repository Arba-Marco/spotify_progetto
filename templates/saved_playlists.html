<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le tue Playlist Salvate</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-image: linear-gradient(to top, #0a3d13 0%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.3);
            margin-top: 2rem;
        }

        .header {
            background-color: #2d2d2d;
            border-radius: 15px;
            padding: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #4CAF50;
            margin-bottom: 1rem;
        }

        .select-playlists-label {
            color: #000;
            font-weight: 500;
            margin-bottom: 1rem;
        }

        .playlist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .playlist-card {
            background-color: #2d2d2d;
            border: 1px solid #444;
            border-radius: 15px;
            padding: 1.5rem;
            position: relative;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .playlist-card:hover {
            background-color: #333;
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .playlist-info {
            margin-bottom: 1rem;
        }

        .playlist-actions {
            display: flex;
            gap: 0.5rem;
            justify-content: flex-end;
        }

        .btn {
            border-radius: 30px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0.5rem;
        }

        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }

        .btn-primary:hover {
            background-color: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            background-color: #333;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #444;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-success {
            background-color: #4CAF50;
            color: white;
        }

        .btn-success:hover {
            background-color: #45a049;
        }

        .btn-back {
            background-color: #1DB954;
            color: white;
        }

        .btn-back:hover {
            background-color: #1A864E;
        }

        .form-check-input {
            position: absolute;
            top: 1rem;
            right: 1rem;
            transform: scale(1.3);
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .header h1 {
                font-size: 2rem;
            }

            .playlist-grid {
                grid-template-columns: 1fr;
            }

            .playlist-actions {
                justify-content: flex-start;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Le tue Playlist Salvate</h1>
        </div>

        <form action="{{ url_for('home.compare_playlists') }}" method="POST" class="mt-4">
            <div class="mb-4">
                <label class="select-playlists-label">Seleziona playlist da confrontare</label>
                {% for playlist in playlists %}
                    <div class="playlist-card d-flex justify-content-between align-items-center px-3 py-2 mb-2 rounded">
                        <input type="checkbox" name="playlist_ids" value="{{ playlist['id'] }}" class="form-check-input">
                        <div>
                            <strong>{{ playlist['name'] }}</strong><br>
                            <small class="text-muted">{{ playlist['tracks']['total'] }} brani</small>
                        </div>
                    </div>
                {% endfor %}
            </div>
            <button type="submit" class="btn btn-success px-4 py-2 rounded-pill">Confronta Playlist</button>
        </form>

        <div class="playlist-grid">
            {% for playlist in playlists %}
                <div class="playlist-card">
                    <div class="playlist-info">
                        <h4>{{ playlist['name'] }}</h4>
                        <p class="text-muted">{{ playlist['tracks']['total'] }} brani</p>
                    </div>
                    <div class="playlist-actions">
                        <a href="{{ url_for('home.playlist_tracks', playlist_id=playlist['id']) }}" class="btn btn-primary">Visualizza</a>
                        <a href="{{ url_for('home.playlist_analysis', playlist_id=playlist['id']) }}" class="btn btn-secondary">Analizza</a>
                        <a href="{{ url_for('home.share_playlist', playlist_id=playlist['id']) }}" class="btn btn-success">Condividi</a>
                    </div>
                </div>
            {% endfor %}
        </div>

        <br>
        <a href="{{ url_for('home.homepage') }}" class="btn btn-back">Torna alla Home</a>
    </div>
</body>
</html>
